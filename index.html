<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>A-Frame で超簡単 AR</title>
    </head>

    <body style="margin: 0px; overflow: hidden">
        <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

        <a-scene
            embedded
            arjs="debugUIEnabled: false;"
            renderer="logarithmicDepthBuffer: true;"
        >
            <a-assets>
                <a-asset-item
                    id="earth"
                    src="img/earth__terra_-_downloadable_model.glb"
                ></a-asset-item>
            </a-assets>

            <!-- 明るさ調整 -->
            <a-entity light="type: ambient; intensity: 1.2"></a-entity>
            <a-entity
                light="type: directional; intensity: 0.8"
                position="1 1 0"
            ></a-entity>

            <!-- マーカーを認識したときだけ地球を表示 -->
            <a-marker type="pattern" url="img/pattern-QR_725882.patt">
                <a-entity
                    id="earth-model"
                    gltf-model="#earth"
                    position="0 0.2 0"
                    scale="0.5 0.5 0.5"
                    rotation="0 0 0"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear; pauseEvents: pauseRotation; resumeEvents: resumeRotation"
                ></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>

        <script>
            const earthModel = document.querySelector("#earth-model");

            let isRotating = true;

            window.addEventListener("pointerdown", () => {
                if (isRotating) {
                    earthModel.emit("pauseRotation");
                } else {
                    earthModel.emit("resumeRotation");
                }

                isRotating = !isRotating;
            });
        </script>
    </body>
</html>
