<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>A-Frame で超簡単 AR</title>
    </head>
    <body style="margin: 0px; overflow: hidden">
        <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
        <!-- A-Frame の VR空間に AR.js を紐づける（デバッグUIは非表示） -->
        <a-scene embedded arjs="debugUIEnabled:false;">
            <!-- マーカーを登録（プリセットされている「hiro」マーカー） -->
            <a-assets>
                <a-asset-item
                    id="earth"
                    src="img/earth__terra_-_downloadable_model.glb"
                ></a-asset-item>
            </a-assets>

            <!-- 明るさ調整 -->
            <a-entity light="type: ambient; intensity: 1.2"></a-entity>
            <a-entity
                light="type: directional; intensity: 0.8"
                position="1 1 0"
            ></a-entity>

            <!-- マーカーを表示 -->
            <a-marker type="pattern" url="img/pattern-QR_725882.patt">
                <a-entity
                    gltf-model="#earth"
                    position="0 0 0"
                    scale="0.3 0.3 0.3"
                    rotation="0 0 0"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
                ></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
